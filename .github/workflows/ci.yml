name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=finrag --cov-report=term-missing
      - name: Avaliação de recuperação (corpus de exemplo)
        run: |
          python -m finrag.pipeline index data/sample/docs
          python -m finrag.eval.retrieval_eval data/eval/questions.jsonl
      - name: Capturar demonstração da interface
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          python -m uvicorn finrag.api:app --host 127.0.0.1 --port 8000 > /tmp/finrag-demo.log 2>&1 &
          pid=$!
          trap 'status=$?; kill "$pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/finrag-demo.log; fi' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --max-time 3 http://127.0.0.1:8000/ -o /dev/null
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          from playwright.sync_api import expect, sync_playwright

          def capture(page):
              shot = page.screenshot(animations="disabled")
              return Image.open(BytesIO(shot)).convert("RGB").resize((900, 600), Image.Resampling.LANCZOS)

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(viewport={"width": 1080, "height": 720},
                                      color_scheme="light", reduced_motion="reduce")
              page.goto("http://127.0.0.1:8000/")
              question = page.get_by_role("button", name="Qual é a taxa de administração do Fundo Exemplo Alpha?")
              expect(question).to_be_visible()
              intro = capture(page)
              question.click()
              result = page.locator(".answer-text")
              expect(result).to_contain_text("1,2%")
              answer = capture(page)
              result.locator("button.cite").first.click()
              expect(page.locator("#panel-article")).to_have_text("Art. 4º")
              expect(page.locator("#panel-text")).to_contain_text("1,2%")
              source = capture(page)
              browser.close()
          intro.save("demo.gif", save_all=True, append_images=[answer, source],
                     duration=[2200, 2200, 3600], loop=0, optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finrag-offline-demo
          path: demo.gif
