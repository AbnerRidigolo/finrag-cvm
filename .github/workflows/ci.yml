name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=finrag --cov-report=term-missing
      - name: Avaliação de recuperação (corpus de exemplo)
        run: |
          python -m finrag.pipeline index data/sample/docs
          python -m finrag.eval.retrieval_eval data/eval/questions.jsonl
