[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag-cvm"
version = "0.2.0"
description = "RAG híbrido (denso + esparso + re-ranking) e grafo de fundos sobre dados públicos da CVM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
openai = ["openai>=3.19.2"]
anthropic = ["anthropic>=1.8.0"]
rerank = ["sentence-transformers>=3.0"]
graph = ["neo4j>=5.20"]
pinecone = ["pinecone>=10.0.0"]
all = ["finrag-cvm[openai,anthropic,rerank,graph,pinecone]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
